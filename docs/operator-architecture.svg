<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 200" font-family="Arial, sans-serif">

  <text x="380" y="22" text-anchor="middle" font-size="13" font-weight="bold" fill="#212121">swim-operator: Kubernetes Operator Pattern</text>

  <rect x="20" y="60" width="100" height="50" rx="6" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <text x="70" y="82" text-anchor="middle" font-size="11" font-weight="bold" fill="#bf360c">Admin</text>
  <text x="70" y="96" text-anchor="middle" font-size="10" fill="#546e7a">kubectl apply</text>

  <line x1="120" y1="85" x2="170" y2="85" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="170" y="50" width="130" height="70" rx="6" fill="#e8eaf6" stroke="#3949ab" stroke-width="1.5"/>
  <text x="235" y="74" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a237e">Custom Resource</text>
  <text x="235" y="90" text-anchor="middle" font-size="10" fill="#546e7a">SwimDnotamConsumer</text>
  <text x="235" y="104" text-anchor="middle" font-size="10" fill="#546e7a">SwimDnotamProvider</text>
  <text x="235" y="116" text-anchor="middle" font-size="10" fill="#546e7a">SwimEd254*</text>

  <line x1="300" y1="85" x2="350" y2="85" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="350" y="50" width="160" height="70" rx="6" fill="#fce4ec" stroke="#c62828" stroke-width="2"/>
  <text x="430" y="74" text-anchor="middle" font-size="12" font-weight="bold" fill="#b71c1c">Operator Controller</text>
  <text x="430" y="90" text-anchor="middle" font-size="10" fill="#546e7a">watches CRs / reconciles</text>
  <text x="430" y="104" text-anchor="middle" font-size="10" fill="#546e7a">Helm-based lifecycle</text>

  <line x1="510" y1="75" x2="560" y2="65" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="510" y1="95" x2="560" y2="105" stroke="#757575" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="560" y="40" width="180" height="40" rx="6" fill="#e3f2fd" stroke="#1565c0" stroke-width="1"/>
  <text x="650" y="57" text-anchor="middle" font-size="10" font-weight="bold" fill="#0d47a1">Deployment / Service</text>
  <text x="650" y="71" text-anchor="middle" font-size="10" fill="#546e7a">ConfigMap / Secret</text>

  <rect x="560" y="88" width="180" height="40" rx="6" fill="#e8f5e9" stroke="#2e7d32" stroke-width="1"/>
  <text x="650" y="105" text-anchor="middle" font-size="10" font-weight="bold" fill="#1b5e20">Artemis CR / Route</text>
  <text x="650" y="119" text-anchor="middle" font-size="10" fill="#546e7a">cert-manager Certificate</text>

  <text x="380" y="165" text-anchor="middle" font-size="10" fill="#78909c">One CR deploys a complete SWIM service stack. Consumer connects to its validator, not to the provider.</text>

  <defs>
    <marker id="arr" markerWidth="7" markerHeight="7" refX="5" refY="3" orient="auto">
      <path d="M0,0 L0,6 L7,3 z" fill="#757575"/>
    </marker>
  </defs>

</svg>
