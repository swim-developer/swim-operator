# This rule is not used by the project swim-kubernetes-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to apps.swim-developer.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: swim-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: swimdnotamconsumervalidator-viewer-role
rules:
- apiGroups:
  - apps.swim-developer.github.io
  resources:
  - swimdnotamconsumervalidators
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps.swim-developer.github.io
  resources:
  - swimdnotamconsumervalidators/status
  verbs:
  - get
