# This rule is not used by the project swim-kubernetes-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the apps.swim-developer.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: swim-kubernetes-operator
    app.kubernetes.io/managed-by: kustomize
  name: swimdigitalnotamprovider-editor-role
rules:
- apiGroups:
  - apps.swim-developer.github.io
  resources:
  - swimdigitalnotamproviders
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps.swim-developer.github.io
  resources:
  - swimdigitalnotamproviders/status
  verbs:
  - get
