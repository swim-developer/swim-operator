apiVersion: v1
kind: Service
metadata:
  name: {{ include "swim-kubernetes-operator.fullname" . }}-metrics-service
  labels:
    {{- include "swim-kubernetes-operator.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: metrics
  selector:
    {{- include "swim-kubernetes-operator.selectorLabels" . | nindent 4 }}
