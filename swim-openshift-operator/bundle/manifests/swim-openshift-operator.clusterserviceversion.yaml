  description: |
    # SWIM Operator

    The **SWIM Operator** provides an automated, Kubernetes-native method to deploy and manage applications compliant with the **System Wide Information Management (SWIM)** standards, specifically focusing on the **Yellow Profile** and **CP1 (Common Project 1)** requirements.

    This operator orchestrates the complex infrastructure required for aviation data exchange, handling certificate management (mTLS), middleware provisioning (Kafka, Artemis), and application lifecycle management on any Kubernetes environment such as **Red Hat Openshift**.

    ## Supported SWIM Services

    * **DNOTAM** (Digital NOTAM) — aeronautical notice management (CP1 mandatory)
    * **ED-254** (Extended AMAN) — arrival sequence service (EUROCAE ED-254)
    * **FF-ICE** (Flight and Flow Information) — collaborative flight planning

    ## Key Features

    * **Automated Infrastructure**: Provisioning of Kafka Clusters (via AMQ Streams) and ActiveMQ Artemis Brokers (via AMQ Broker).
    * **Security by Default**: Automatic generation and rotation of mTLS certificates using Cert-Manager for secure service-to-service communication.
    * **Integrated Storage**: Automated management of MongoDB sidecars for stateful application components.
    * **Configuration Management**: Hash-based configuration tracking to ensure seamless updates and consistency across deployments.

    ## Managed Custom Resources (CRDs)

    The operator exposes twelve specialized resources (four per SWIM service) to build your SWIM topology:

    ### 1. SwimDigitalNotamConsumer
    Represents a **Consumer Node**. It establishes a secure link to external or internal SWIM Services to ingest and process aeronautical data.
    * **Function**: Acts as a protocol bridge, consuming high-volume messages via AMQP/AMQPS, performing strict XML/XSD validation, and forwarding events to an internal Kafka cluster.
    * **Architecture**: Orchestrates a high-performance **Quarkus** client application paired with a managed **MongoDB** sidecar for local persistence and state management.
    * **Security**: Enforces Zero Trust principles by automating mTLS certificate generation and rotation for upstream connections using Cert-Manager.
    * **Key Features**:
      * **Internal Query API**: Exposes a REST API allowing internal systems to query and retrieve processed NOTAM events directly from the local store.
      * **Declarative Subscriptions**: Manages subscriptions to upstream Information Providers via simple external configuration, abstracting complex AMQP binding logic.
      * **Resilient Messaging**: Implements the **Transactional Outbox Pattern** using MongoDB, ensuring zero message loss during bridging between the external SWIM service and the internal Kafka cluster.

    ### 2. SwimDigitalNotamProvider
    Represents a **Publisher Node**. It exposes a compliant SWIM Service endpoint for other stakeholders.
    * **Function**: Consumes events from Kafka and exposes them via an embedded **ActiveMQ Artemis** broker.
    * **Architecture**: Deploys a Quarkus-based provider application backed by a **PostgreSQL** database.
    * **Interfaces**: Provides secure HTTP/HTTPS endpoints and AMQPS interfaces with full JMX monitoring support.
    SWIM Publication Gateway: Instantly transforms your organization into an active SWIM Publisher, enabling standard-compliant data sharing with the global aviation network.

    * **Kafka-to-SWIM Bridge**: Acts as a robust protocol translator, bridging high-throughput internal Kafka streams to standardized AMQP/HTTP interfaces required by CP1 standards.

    * **Automated "Yellow Profile" Security**: Removes the complexity of aviation security compliance by fully automating mTLS certificate issuance, rotation, and JKS/PKCS12 keystore generation.

    * **Full-Stack Orchestration**: Provides a production-ready topology in a single click, automatically provisioning and managing the embedded ActiveMQ Artemis broker and PostgreSQL persistence layer.

    * **Mission-Critical Reliability**: Features advanced configuration hashing for safe rolling updates and dedicated JMX endpoints for deep insight into broker performance.

    ### 3. SWIM DNOTAM Consumer Validator
    A lightweight simulation tool for development and testing.
    * **Function**: Simulates a SWIM CP1 DNOTAM service.
    * **Features**: Includes a configurable Event Generator and provides necessary AMQPS with mTLS endpoints without requiring full infrastructure.

    ### 4. SwimDnotamProviderValidator
    A web-based client interface for testing and demonstrating SWIM DNOTAM Provider APIs.
    * **Function**: Provides a user-friendly web UI to interact with SWIM DNOTAM Provider services, enabling developers and testers to validate API integrations.
    * **Features**: Supports OAuth2/OIDC authentication via Keycloak, mTLS for secure communication, and dynamic configuration of target Provider endpoints.
    * **Use Case**: Ideal for development environments, demos, and integration testing without requiring a full Consumer stack.

    ## Observability & Traceability

    This operator is engineered with a **"Day 2 Operations"** mindset, offering out-of-the-box integration with the Red Hat OpenShift Observability Stack.

    * **End-to-End Distributed Tracing**: Native support for **OpenTelemetry** propagates context across the entire mesh. You can trace a NOTAM event from ingestion at the *Client*, through the *Kafka* backbone, down to the *Provider's* final publication, visualizing the full lifecycle in Jaeger or Tempo.
    * **Native Monitoring Integration**: Automatically provisions `ServiceMonitors` for all managed workloads. Critical metrics from Quarkus microservices, Artemis brokers (JMX), and Kafka clusters are instantly available in the OpenShift Monitoring (Prometheus) console.
    * **Structured Logging**: All components are configured to emit **Structured JSON** logs by default, ensuring seamless parsing, filtering, and correlation by the OpenShift Logging subsystem (Vector/Loki/Elasticsearch).

    ## Prerequisites

    To ensure proper functionality, the following Operators must be present in the cluster:
    * **Red Hat AMQ Streams** (or Strimzi Kafka Operator)
    * **Red Hat AMQ Broker** (or ActiveMQ Artemis Operator)
    * **Cert-Manager** (for certificate issuance)
