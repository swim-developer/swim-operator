apiVersion: apps.swim-developer.github.io/v1alpha1
kind: SwimEd254ProviderValidator
metadata:
  name: ed254-provider-validator
  labels:
    app.kubernetes.io/name: swim-openshift-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  keycloak:
    url: "https://rhbk.apps.ocp4.masales.cloud/"
    realm: "swim"
    clientId: "swim-public-client"
  providerAPIURLs: "https://swim-ed254-provider-mtls-swim-sandbox.apps.ocp4.masales.cloud"
  amqp:
    host: "swim-ed254-provider-artemis-swim-sandbox.apps.ocp4.masales.cloud"
    port: 443
  mtls:
    enabled: true
    certsSecretName: "swim-ed254-client-tls"
    passwordsSecretName: "ed254-provider-validator-passwords"
