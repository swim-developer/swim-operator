apiVersion: apps.swim-developer.github.io/v1alpha1
kind: SwimEd254Consumer
metadata:
  name: swim-ed254-consumer
spec:
  certManager:
    issuerKind: ClusterIssuer
    issuerName: swim-ca-issuer
  consumer:
    config:
      providers:
        - providerId: "validator"
          subscriptionManager:
            url: "https://ed254-consumer-validator-swim-external-provider.apps.ocp4.masales.cloud"
          amqpBroker:
            host: "ed254-consumer-validator-artemis-swim-external-provider.apps.ocp4.masales.cloud"
            port: 443
            sslEnabled: true
            username: "admin"
            password: "admin"
      ed254Subscriptions:
        - provider: "validator"
          destinationAerodrome:
            - aerodromeDesignator: "LPPT"
            - aerodromeDesignator: "LPPR"
          pointName: []
          flightSelector: []
          supplementaryData: null
          description: "Arrival sequence for Lisbon and Porto airports"
      observability:
        otelEndpoint: "http://tempo-simplest-distributor.tempostack.svc.cluster.local:4317"
